<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AI Student Assistant</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f8;
        }

        .header {
            background: #2563eb;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 80%;
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        #answer {
            margin-top: 25px;
            padding: 15px;
            background: #f1f5f9;
            border-radius: 8px;
            white-space: pre-wrap;
            line-height: 1.6;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>AI Student Assistant</h1>
    <p>Powered by Gemini</p>
</div>

<div class="container">

    <h2>Ask AI</h2>

    <textarea
        id="question"
        placeholder="Ask your question here..."
    ></textarea>

    <button onclick="askAI()">Ask AI</button>

    <div id="answer">
        Your answer will appear here.
    </div>

</div>

<script>

async function askAI() {

    const question =
        document.getElementById("question").value.trim();

    const answer =
        document.getElementById("answer");

    if (!question) {
        answer.innerText = "Please enter a question.";
        return;
    }

    answer.innerText = "Thinking...";

    try {

        const response = await fetch("/ask", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                question: question
            })
        });

        const data = await response.json();

        answer.innerText = data.answer;

    } catch (error) {

        console.error(error);

        answer.innerText =
            "Something went wrong: " + error.message;
    }
}

</script>

</body>
</html>
